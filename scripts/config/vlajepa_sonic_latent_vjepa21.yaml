# =============================================================================
# SonicStar (Unitree G1) latent-action training — V-JEPA 2.1 ViT-L/16 (300M, 384)
# -----------------------------------------------------------------------------
# This config switches the world-model visual encoder to V-JEPA 2.1 ViT-L/384.
#
# PREREQUISITES before this config can run (see pipeline.md changelog):
#   1) Weights: download the V-JEPA 2.1 ViT-L/384 checkpoint and place it at the
#      `base_encoder` path below. As of now Meta ships 2.1 via PyTorch Hub
#      (`torch.hub.load('facebookresearch/vjepa2', 'vjepa2_1_vit_large_384')`);
#      HF Hub upload is still pending (facebookresearch/vjepa2#137).
#   2) Loader support: the installed `transformers` (5.8.1) does NOT yet support
#      the 2.1 architecture (corrected RoPE / modality embeddings / deep
#      supervision norms / proj_context). Either upgrade transformers to a build
#      that includes huggingface/transformers#45497, or adapt VLA_JEPA.py to load
#      the encoder via Meta's torch.hub path.
#   3) Resolution: 2.1 ViT-L final checkpoint is 384px (cool-down phase), hence
#      `video_resolution_size: 384` below (was 256 for fpc16/fpc64 256px models).
# Backbone dims are unchanged vs ViT-L/256 (hidden_size=1024, tubelet_size=2,
# patch_size=16), so the action model / predictor dims need no change.
# =============================================================================
# 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
run_id: sonic_latent_vjepa21
run_root_dir: checkpoints
seed: 42
trackers:
- json
- wandb
wandb_entity: xinyu-xiao-kinetix-ai
wandb_project: vlajepa_sonic_latent_vjepa21
is_debug: false
framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /cpfs_infra/shared/xiaoxinyu/VLA-JEPA/VLA-JEPA-DEV/Qwen3-VL-2B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 78
    state_dim: 46
    future_action_window_size: 39
    action_horizon: 40
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    # V-JEPA 2.1 ViT-L/16 (300M), 384px. Meta raw `.pt` checkpoint; a `.pt` path
    # triggers the vendored 2.1 encoder adapter in VLA_JEPA.py (transformers can't
    # load 2.1). checkpoint key used internally = "ema_encoder".
    base_encoder: /cpfs_infra/shared/xiaoxinyu/VLA-JEPA/VLA-JEPA-DEV/VJEPA21/vjepa2_1_vitl_dist_vitG_384.pt
    arch: vit_large
    image_size: 384
    num_video_views: 1
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /cpfs_infra/shared/xiaoxinyu/VLA-JEPA/VLA-JEPA-DEV/dataset
    data_mix: sonic_merged_dataset_001
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 224   # image input of VLA will be resized and video will not, video will be precessed by world model videoprocessor
    per_device_batch_size: 32
    video_resolution_size: 384   # V-JEPA 2.1 ViT-L final checkpoint is 384px (was 256)
    load_all_data_for_training: true
    with_state: true
    duplicate_single_view: false   # single ego_view: don't duplicate, avoid running V-JEPA encoder twice
    num_workers: 16
    prefetch_factor: 4


trainer:
  epochs: 100
  max_train_steps: 90000
  num_warmup_steps: 1000
  save_interval: 30000
  eval_interval: 500
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  #pretrained_checkpoint: the path of pretrained checkpoint.

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true

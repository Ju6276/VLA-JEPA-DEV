# Deployment override example for VLA_JEPA checkpoints.
#
# Training checkpoints may store `framework.privileged_latent.load_vjepa: true`
# because VJEPA/Teacher/DeltaDecoder are needed for training-only losses.
# Deployment disables them: predict_action() uses image/lang/state_0 only.

framework:
  privileged_latent:
    load_vjepa: false
    delta_action_grounding: false

# Deployment override example for VLA_JEPA checkpoints.
#
# Training checkpoints may store `framework.privileged_latent.load_vjepa: true`
# because VJEPA is needed for teacher-side losses. Deployment must disable it:
# predict_action() only uses image/lang/state_0 and never runs VJEPA.

framework:
  privileged_latent:
    load_vjepa: false
